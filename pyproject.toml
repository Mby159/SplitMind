[project]
name = "splitmind"
version = "0.1.0"
description = "Privacy-preserving multi-agent task orchestration system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SplitMind Team"}
]
keywords = ["ai", "privacy", "multi-agent", "llm", "task-orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 核心依赖 - 最小化
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# AI 提供商支持
providers = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "httpx>=0.25.0",
    # ollama_manager.get_system_info() 里 `import psutil`（无 try/except），
    # 之前没有任何 extra 声明它 → 调用即 ImportError
    "psutil>=5.0.0",
]

# 命令行工具
cli = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

# Web 界面
# 注意：原来看起来需要的 jinja2 实测零引用（全包 grep 无 jinja2 / Jinja2Templates），已移除
web = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
]

# 完整安装
all = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "httpx>=0.25.0",
    "psutil>=5.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
]

# 开发工具
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black==24.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
splitmind = "splitmind.cli:main"

[project.entry-points."splitmind.provider"]
# 第三方插件可以通过这个 entry point 注册
# 例如: my-provider = "my_provider.module:MyProvider"
# 内置 providers 已在代码中自动注册

[project.urls]
Homepage = "https://github.com/Mby159/SplitMind"
Documentation = "https://github.com/Mby159/SplitMind#readme"
Repository = "https://github.com/Mby159/SplitMind"
Issues = "https://github.com/Mby159/SplitMind/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["splitmind*"]
exclude = ["packages*"]

[tool.pytest.ini_options]
# 只收集 tests/。examples/ 里有两个历史脚本的名字以 _test.py 结尾
# （comprehensive_test.py、providers_test.py），它们 import 的是废弃的
# packages/ 布局，裸跑 `pytest` 会因此直接报 collection error。
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "import-not-found",
    "import-untyped",
    "misc",
    "no-any-return",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
    "var-annotated",
]
